# Allwinner H618 quad core 1GB/1.5GB/2GB/4GB RAM
BOARD_NAME="Orange Pi Zero 3"
BOARDFAMILY="sun50iw9"
BOOTCONFIG="orangepi_zero3_defconfig"
KERNEL_TARGET="legacy,current"
MODULES="uwe5622_bsp_sdio sprdwl_ng sprdbt_tty"
MODULES_BLACKLIST_LEGACY="bcmdhd"

# Security features
ENABLE_SECURE_BOOT="yes"
ENABLE_DISK_ENCRYPTION="yes"

# Kernel configuration override for security features
KERNELCONFIG="linux-${BOARDFAMILY}-${BRANCH}${KERNEL_CONFIG_SUFFIX:-}.config"

# Boot script override for secure boot
BOOTSCRIPT="boot-${BOARDFAMILY}${BOOTSCRIPT_SUFFIX:-}.cmd"

# Additional packages for security
PACKAGE_LIST_BOARD="cryptsetup busybox dropbear-initramfs"