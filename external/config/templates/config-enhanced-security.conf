# Orange Pi Zero3 Enhanced Security Configuration
# Modern 2025 security features and best practices

# Basic board configuration
BOARD="orangepizero3"
BRANCH="legacy"
RELEASE="bookworm"

# Security features
ENABLE_SECURE_BOOT="yes"
ENABLE_DISK_ENCRYPTION="yes"
ENABLE_ENHANCED_SECURITY="yes"

# Modern security packages (2025 best practices)
PACKAGE_LIST_ADDITIONAL="cryptsetup busybox dropbear-initramfs rng-tools haveged fail2ban auditd apparmor-profiles apparmor-utils chkrootkit rkhunter lynis"

# Kernel hardening
KERNEL_CONFIG_SUFFIX="-secure"
EXTRABOARDARGS="audit=1 audit_backlog_limit=8192 apparmor=1 security=apparmor slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1"

# Boot script with enhanced security
BOOTSCRIPT_SUFFIX="-secure"

# Enhanced entropy and random number generation
ENABLE_HARDWARE_RNG="yes"

# Container security enhancements
DOCKER_OPTIMIZATIONS_SECURITY="yes"

# Memory protection
ENABLE_MEMORY_PROTECTION="yes"

# Audit and logging enhancements
ENABLE_STRUCTURED_LOGGING="yes"

# Build options
BUILD_MINIMAL="no"
BUILD_DESKTOP="no"
KERNEL_ONLY="no"
KERNEL_CONFIGURE="no"

# Output options
COMPRESS_OUTPUTIMAGE="sha,gpg,xz"

# Security hardening during build
ENABLE_BUILD_HARDENING="yes"

# Root password (MUST BE CHANGED!)
ROOT_PASSWORD="OrangePiSecure2025!"

# Additional security configurations
ENABLE_FIREWALL="yes"
ENABLE_INTRUSION_DETECTION="yes"
ENABLE_FILE_INTEGRITY="yes"

# Modern crypto preferences
CRYPTO_POLICY="FIPS:OSPP"