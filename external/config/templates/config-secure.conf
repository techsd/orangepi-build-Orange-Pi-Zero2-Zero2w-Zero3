# Orange Pi Zero3 Secure Configuration Template
# Copy this to userpatches/config-secure.conf and modify as needed

# Board selection
BOARD="orangepizero3"
BRANCH="legacy"
RELEASE="bookworm"

# Build options
BUILD_MINIMAL="no"
BUILD_DESKTOP="no"
KERNEL_ONLY="no"
KERNEL_CONFIGURE="no"

# Security features
ENABLE_SECURE_BOOT="yes"
ENABLE_DISK_ENCRYPTION="yes"
INSTALL_SECURITY_PACKAGES="yes"

# Additional security packages
PACKAGE_LIST_ADDITIONAL="cryptsetup busybox dropbear-initramfs rng-tools haveged"

# Custom kernel configuration
KERNEL_CONFIG_SUFFIX="-secure"

# Boot script selection
BOOTSCRIPT_SUFFIX="-secure"

# Compression and output
COMPRESS_OUTPUTIMAGE="sha,gpg,xz"

# Root password (change this!)
ROOT_PASSWORD="changeme123!"

# Additional boot parameters for security
EXTRABOARDARGS="audit=1 audit_backlog_limit=8192"